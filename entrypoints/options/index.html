<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fill Pro — Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100vh;
      background: #0B1120;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
    }
    #root { min-height: 100vh; }
    .fp-preloader {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 100vh;
      background: #0B1120;
      color: white;
    }
    .fp-header-skeleton {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: #0B1120;
    }
    .fp-logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .fp-logo-img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }
    .fp-title-text {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }
    .fp-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #6366F1;
      border-radius: 50%;
      animation: fpSpin 0.8s linear infinite;
    }
    @keyframes fpSpin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="fp-preloader">
      <div class="fp-header-skeleton">
        <div class="fp-logo-wrap">
          <img src="/icons/icon-32.png" alt="Fill Pro" class="fp-logo-img" />
          <div class="fp-title-text">Fill Pro — Settings</div>
        </div>
        <div class="fp-spinner"></div>
      </div>
    </div>
  </div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
